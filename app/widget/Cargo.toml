[package]
name = "claude-session-widget"
version = "2.0.0-alpha.1"
description = "Shows the Claude Code sessions running right now and their progress."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
claude-session-core = { path = "../core" }
egui = "0.34.3"
egui_software_backend = "0.0.3"
tray-icon = "0.26.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
