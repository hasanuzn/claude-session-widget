[workspace]
members = ["core", "widget"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/hasanuzn/claude-session-widget"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Local fix for timed repaints, see vendor/egui_software_backend/PATCHES.md
[patch.crates-io]
egui_software_backend = { path = "vendor/egui_software_backend" }
