name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check [existing issues](https://github.com/hasanuzn/claude-session-widget/issues) first.
        Note: the widget only reads local files and never uses the network, so features that need an online service or write to Claude's files are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "When I run five sessions at once, I can't tell ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the widget to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Session detection / progress
        - Icon and card
        - Notifications
        - Settings
        - Installer / uninstaller
        - Other
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
